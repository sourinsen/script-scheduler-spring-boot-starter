# Test configuration for Script Scheduler
script-scheduler:
  enabled: true
  thread-pool-size: 5
  shutdown-timeout-seconds: 30
  default-timeout-seconds: 60
  default-interpreter: /bin/sh
  default-log-output: true
  
  jobs:
    # Test job that runs every minute
    - name: test-job-1
      script: src/test/resources/test-scripts/success.sh
      cron: "0 * * * * ?"
      description: "Test job that always succeeds"
      timeout-seconds: 10
      log-output: true
    
    # Test job with environment variables
    - name: test-job-2
      script: src/test/resources/test-scripts/env-test.sh
      cron: "30 * * * * ?"
      description: "Test job with environment variables"
      environment:
        TEST_ENV_VAR: test-value
        ANOTHER_VAR: another-value
    
    # Test job with retry configuration
    - name: test-job-3
      script: src/test/resources/test-scripts/retry-test.sh
      cron: "0 0 * * * ?"
      description: "Test job with retry logic"
      retry-attempts: 2
      retry-delay-seconds: 5
